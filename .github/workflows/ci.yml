name: Full Stack CI

on:
  push:
    branches:
      - main

jobs:

  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dotnet-api

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Restore Packages
      run: dotnet restore

    - name: Build API
      run: dotnet build --configuration Release

    - name: Publish API
      run: dotnet publish -c Release -o ./publish

    - name: Upload API Artifact
      uses: actions/upload-artifact@v5
      with:
        name: dotnet-api
        path: ./dotnet-api/publish

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./angular-client

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: Install Packages
      run: npm install

    - name: Build Angular App
      run: npm run build -- --configuration production

    - name: Upload Angular Artifact
      uses: actions/upload-artifact@v5
      with:
        name: angular-client
        path: ./angular-client/dist